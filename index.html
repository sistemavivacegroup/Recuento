<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101311">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Recuento · Vivace</title>
<script>
(function(){
  var RUTA_PORTAL = '/Portal/';   // ⚠ ajustar si el repo del portal tiene otro nombre
  try{
    var s = JSON.parse(localStorage.getItem('vivace_sesion')||'null');
    if(!s || !s.token || Date.now()-s.creada > 14*3600*1000){ location.replace(RUTA_PORTAL); }
    else { window.VIVACE_USER = s; }
  }catch(e){ location.replace(RUTA_PORTAL); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700..900&family=Inter:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--fondo:#101311;--tarjeta:#1a1f1b;--linea:#2a322c;--papel:#f2ede4;--tinta:#9aa89e;
        --ok:#58c281;--sube:#ff5d45;--baja:#7aa7d9;--aviso:#ffb020}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--fondo);color:var(--papel);font-family:'Inter',system-ui,sans-serif;
       padding-bottom:104px}
  .marco{max-width:820px;margin:0 auto;min-height:100vh}
  header{position:sticky;top:0;background:var(--fondo);border-bottom:1px solid var(--linea);
         padding:13px 16px 0;z-index:8}
  .h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  h1{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;font-size:17px;
     letter-spacing:.5px;text-transform:uppercase}
  h1 small{color:var(--tinta);font-family:'Space Mono',monospace;font-size:10.5px;display:block;
           margin-top:3px;text-transform:none;letter-spacing:0}
  #quien{color:var(--tinta);font-size:11px;text-align:right;line-height:1.5}
  #quien a{color:var(--tinta)}
  #buscar{width:100%;background:var(--tarjeta);border:1px solid var(--linea);color:var(--papel);
          border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit;margin:11px 0 9px}
  #buscar:focus{outline:none;border-color:var(--tinta)}
  .cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:11px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{flex:0 0 auto;background:var(--tarjeta);border:1px solid var(--linea);color:var(--tinta);
    padding:7px 13px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:inherit;
    cursor:pointer;white-space:nowrap}
  .cats button.on{background:var(--papel);color:var(--fondo);border-color:var(--papel)}
  main{padding:12px 16px}
  .aviso{border-left:3px solid var(--aviso);background:rgba(255,176,32,.07);padding:11px 13px;
    border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.55;margin-bottom:12px}
  .aviso.mal{border-color:var(--sube);background:rgba(255,93,69,.07)}
  .aviso.bien{border-color:var(--ok);background:rgba(88,194,129,.07)}
  .grupo{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:11px;
    text-transform:uppercase;letter-spacing:.8px;color:var(--tinta);margin:18px 0 8px;
    display:flex;justify-content:space-between;align-items:baseline}
  .grupo span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0}
  .fila{background:var(--tarjeta);border:1px solid var(--linea);border-radius:11px;
    padding:11px 12px;margin-bottom:7px;display:flex;align-items:center;gap:11px}
  .fila.hecha{border-color:rgba(88,194,129,.42)}
  .fila .info{flex:1;min-width:0}
  .fila .nom{font-size:14px;font-weight:600;line-height:1.3}
  .fila .meta{font-size:10.5px;color:var(--tinta);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fila .meta b{color:var(--baja);font-weight:700}
  .ctrl{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .ctrl button{width:38px;height:42px;background:var(--fondo);border:1px solid var(--linea);
    color:var(--papel);border-radius:9px;font-size:20px;font-weight:700;font-family:inherit;
    cursor:pointer;line-height:1}
  .ctrl button:active{background:var(--linea)}
  .ctrl input{width:74px;height:42px;background:var(--fondo);border:1px solid var(--linea);
    color:var(--papel);border-radius:9px;text-align:center;font-size:17px;font-weight:700;
    font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums}
  .ctrl input:focus{outline:none;border-color:var(--papel)}
  .ctrl input.puesto{border-color:var(--ok);color:var(--ok)}
  .ud{font-size:10px;color:var(--tinta);width:26px;flex:0 0 auto}
  .vacio{color:var(--tinta);font-size:13px;text-align:center;padding:34px 12px;line-height:1.65}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--fondo);
    border-top:1px solid var(--linea);padding:11px 16px calc(11px + env(safe-area-inset-bottom));z-index:9}
  .pie{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .pie .cifras{flex:1;min-width:0}
  .pie .cifras b{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;font-size:21px;
    font-variant-numeric:tabular-nums;display:block;line-height:1.1}
  .pie .cifras span{font-size:10.5px;color:var(--tinta)}
  .btn{background:var(--papel);color:var(--fondo);border:none;border-radius:10px;
    padding:14px 22px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;
    text-transform:uppercase;letter-spacing:.5px;flex:0 0 auto}
  .btn:disabled{opacity:.4}
  .barra{height:3px;background:var(--linea);border-radius:2px;margin-top:7px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--ok);transition:width .3s}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:var(--papel);
    color:var(--fondo);padding:12px 20px;border-radius:24px;font-size:13px;font-weight:700;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:88%;
    text-align:center;line-height:1.4}
  #toast.on{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:50}
  .modal.on{display:flex}
  .modal .caja{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;
    padding:20px;max-width:420px;width:100%}
  .modal h2{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;font-size:15px;
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:11px}
  .modal p{font-size:13px;line-height:1.6;color:var(--tinta);margin-bottom:8px}
  .modal p b{color:var(--papel)}
  .modal .acc{display:flex;gap:9px;margin-top:17px}
  .modal .acc button{flex:1;padding:13px;border-radius:10px;font-size:13px;font-weight:800;
    font-family:inherit;cursor:pointer;text-transform:uppercase;letter-spacing:.4px}
  .modal .si{background:var(--papel);color:var(--fondo);border:none}
  .modal .no{background:transparent;color:var(--papel);border:1px solid var(--linea)}
  @media(min-width:700px){
    .lista{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .fila{margin-bottom:0}
  }
</style>
</head>
<body>
<div class="marco">
  <header>
    <div class="h-top">
      <h1>Recuento de inventario<small id="hfecha">—</small></h1>
      <div id="quien"></div>
    </div>
    <input id="buscar" type="search" placeholder="Buscar referencia…" autocomplete="off">
    <div class="cats" id="cats"></div>
  </header>

  <main>
    <div id="cabecera"></div>
    <div id="lista"><div class="vacio">Cargando el catálogo…</div></div>
  </main>
</div>

<footer>
  <div class="pie">
    <div class="cifras">
      <b id="f-valor">— €</b>
      <span id="f-prog">0 de 0 referencias contadas</span>
      <div class="barra"><i id="f-barra" style="width:0%"></i></div>
    </div>
    <button class="btn" id="b-cerrar" disabled>Cerrar recuento</button>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="caja">
    <h2>Confirmar recuento</h2>
    <div id="m-cuerpo"></div>
    <div class="acc">
      <button class="no" id="m-no">Volver</button>
      <button class="si" id="m-si">Confirmar</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ⚠ CONFIGURAR: misma URL /exec del Apps Script del Director (Portal.gs enruta todo) */
const API = 'https://script.google.com/macros/s/AKfycbxR12l4LsPLVBLGYIp70JNP4rX9q2UyFKaEpzoVuLTGHwByYNgbauk051r6BAFKOsN7Wg/exec';

const BORRADOR = 'vg_recuento_borrador';
let CAT = [];          // catálogo del economato
let CANT = {};         // id → cantidad contada (solo lo que se ha tocado)
let CAT_FILTRO = '';   // categoría activa
let ESTADO = null;     // csUltimoRecuento_

function tok(){ return (window.VIVACE_USER||{}).token || ''; }

/* JSONP para GET (el /exec no envía cabeceras CORS), POST normal para enviar. */
function jsonp(params){
  return new Promise((res, rej) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(() => { delete window[cb]; s.remove(); rej(new Error('tiempo de espera agotado')); }, 25000);
    window[cb] = d => { clearTimeout(t); delete window[cb]; s.remove(); res(d); };
    params.token = tok();
    const q = Object.entries(params).map(([k,v]) => k+'='+encodeURIComponent(v===undefined?'':v)).join('&');
    s.src = API + '?' + q + '&callback=' + cb;
    s.onerror = () => { clearTimeout(t); delete window[cb]; s.remove(); rej(new Error('sin conexión')); };
    document.body.appendChild(s);
  });
}
async function post(body){
  const r = await fetch(API, { method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(Object.assign({}, body, { token: tok() })) });
  return r.json();
}
function sesionCaida(r){
  if(r && r.error === 'SESION'){
    localStorage.removeItem('vivace_sesion'); location.replace('/Portal/'); return true;
  }
  return false;
}

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3400);
}
function eur(n){ return (Math.round(n*100)/100).toFixed(2).replace('.', ',') + ' €'; }

/* ── BORRADOR LOCAL ──
   Un recuento son ~80 referencias y se hace andando por la cámara. Si se
   bloquea la tablet o se recarga sin querer, lo contado no se pierde: vive en
   el teléfono hasta que se cierra el recuento. */
function guardarBorrador(){
  try{ localStorage.setItem(BORRADOR, JSON.stringify({ f: new Date().toDateString(), c: CANT })); }catch(e){}
}
function cargarBorrador(){
  try{
    const b = JSON.parse(localStorage.getItem(BORRADOR) || 'null');
    if(b && b.f === new Date().toDateString()) return b.c || {};
  }catch(e){}
  return {};
}

/* ── CARGA ── */
async function cargar(){
  try{
    const [est, cat] = await Promise.all([
      jsonp({ action:'cs_ultimo_recuento' }),
      jsonp({ action:'cs_estado' })
    ]);
    if(sesionCaida(est) || sesionCaida(cat)) return;
    if(!cat.ok) throw new Error(cat.error || 'No se pudo leer el catálogo');
    ESTADO = est.ok ? est : null;

    CAT = (cat.products || []).slice().sort((a,b) =>
      (a.c||'').localeCompare(b.c||'') || (a.n||'').localeCompare(b.n||''));
    CANT = cargarBorrador();

    document.getElementById('hfecha').textContent =
      new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
    pintarCabecera();
    pintarCategorias();
    pintar();
  }catch(e){
    document.getElementById('lista').innerHTML =
      '<div class="vacio">No se pudo cargar el catálogo.<br>' + e.message +
      '<br><br>Comprueba la conexión y recarga.</div>';
  }
}

function pintarCabecera(){
  const c = document.getElementById('cabecera');
  if(!ESTADO){ c.innerHTML = ''; return; }
  if(ESTADO.yaHoy){
    c.innerHTML = '<div class="aviso"><b>Ya hay un recuento de hoy</b> por ' +
      eur(ESTADO.ultimaValoracion) + '. Si cierras otro, sustituye al anterior ' +
      'en vez de añadirse.</div>';
  } else if(ESTADO.faltanParaDesviacion > 0){
    c.innerHTML = '<div class="aviso">Este es el recuento nº <b>' + (ESTADO.total + 1) +
      '</b>. El informe de desviación necesita dos recuentos consecutivos: ' +
      (ESTADO.faltanParaDesviacion === 2
        ? 'con el del lunes que viene ya habrá comparación.'
        : 'al cerrar este ya la hay.') + '</div>';
  } else {
    const d = ESTADO.diasDesde;
    const raro = d > 10;
    c.innerHTML = '<div class="aviso ' + (raro ? '' : 'bien') + '">Último recuento: <b>' +
      ESTADO.ultimaFecha + '</b> (' + d + ' días) por ' + eur(ESTADO.ultimaValoracion) + '.' +
      (raro ? ' Han pasado más de 10 días, así que el periodo no será una semana.' : '') + '</div>';
  }
}

function pintarCategorias(){
  const cats = [];
  CAT.forEach(p => { if(p.c && cats.indexOf(p.c) < 0) cats.push(p.c); });
  document.getElementById('cats').innerHTML =
    '<button data-c="" class="on">Todo</button>' +
    '<button data-c="__falta">Sin contar</button>' +
    cats.map(c => '<button data-c="' + c + '">' + c + '</button>').join('');
  document.querySelectorAll('.cats button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('.cats button').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); CAT_FILTRO = b.dataset.c; pintar();
    };
  });
}

function visibles(){
  const q = document.getElementById('buscar').value.trim().toLowerCase();
  return CAT.filter(p => {
    if(CAT_FILTRO === '__falta'){ if(CANT[p.id] !== undefined) return false; }
    else if(CAT_FILTRO && p.c !== CAT_FILTRO) return false;
    if(q && (p.n||'').toLowerCase().indexOf(q) < 0 && (p.p||'').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function pintar(){
  const v = visibles();
  const cont = document.getElementById('lista');
  if(!v.length){
    cont.innerHTML = '<div class="vacio">' +
      (CAT_FILTRO === '__falta' ? '✅ No queda ninguna referencia sin contar.' : 'Nada que mostrar.') +
      '</div>';
    actualizarPie(); return;
  }
  let html = '', ultima = null;
  v.forEach(p => {
    if(p.c !== ultima && !CAT_FILTRO){
      if(ultima !== null) html += '</div>';
      const n = CAT.filter(x => x.c === p.c).length;
      const hechas = CAT.filter(x => x.c === p.c && CANT[x.id] !== undefined).length;
      html += '<div class="grupo">' + p.c + '<span>' + hechas + '/' + n + '</span></div><div class="lista">';
      ultima = p.c;
    } else if(ultima === null){ html += '<div class="lista">'; ultima = p.c; }
    const val = CANT[p.id];
    const puesto = val !== undefined;
    html +=
      '<div class="fila' + (puesto ? ' hecha' : '') + '" data-id="' + p.id + '">' +
        '<div class="info">' +
          '<div class="nom">' + p.n + '</div>' +
          '<div class="meta">' + (p.p || '—') + ' · sistema <b>' + p.nivel + '</b> ' + p.unidad +
            ' · ' + eur(p.price) + '/' + p.unidad + '</div>' +
        '</div>' +
        '<div class="ctrl">' +
          '<button data-a="-">−</button>' +
          '<input type="number" inputmode="decimal" step="0.5" min="0" ' +
            'value="' + (puesto ? val : '') + '" class="' + (puesto ? 'puesto' : '') + '" placeholder="—">' +
          '<button data-a="+">+</button>' +
        '</div>' +
        '<div class="ud">' + p.unidad + '</div>' +
      '</div>';
  });
  html += '</div>';
  cont.innerHTML = html;

  cont.querySelectorAll('.fila').forEach(f => {
    const id = f.dataset.id;
    const inp = f.querySelector('input');
    inp.oninput = () => {
      const v = inp.value.trim();
      if(v === '') delete CANT[id]; else CANT[id] = Math.max(0, parseFloat(v.replace(',', '.')) || 0);
      inp.classList.toggle('puesto', v !== '');
      f.classList.toggle('hecha', v !== '');
      guardarBorrador(); actualizarPie();
    };
    f.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        const paso = b.dataset.a === '+' ? 1 : -1;
        const act = CANT[id] !== undefined ? CANT[id] : 0;
        CANT[id] = Math.max(0, Math.round((act + paso) * 100) / 100);
        inp.value = CANT[id]; inp.classList.add('puesto'); f.classList.add('hecha');
        guardarBorrador(); actualizarPie();
      };
    });
  });
  actualizarPie();
}

function actualizarPie(){
  const ids = Object.keys(CANT);
  let valor = 0;
  CAT.forEach(p => { if(CANT[p.id] !== undefined) valor += CANT[p.id] * p.price; });
  document.getElementById('f-valor').textContent = eur(valor);
  document.getElementById('f-prog').textContent =
    ids.length + ' de ' + CAT.length + ' referencias contadas';
  document.getElementById('f-barra').style.width =
    (CAT.length ? Math.round(ids.length / CAT.length * 100) : 0) + '%';
  document.getElementById('b-cerrar').disabled = !ids.length;
}

document.getElementById('buscar').oninput = pintar;

/* ── CIERRE ── */
document.getElementById('b-cerrar').onclick = () => {
  const ids = Object.keys(CANT);
  const faltan = CAT.length - ids.length;
  let valor = 0;
  CAT.forEach(p => { if(CANT[p.id] !== undefined) valor += CANT[p.id] * p.price; });

  document.getElementById('m-cuerpo').innerHTML =
    '<p>Vas a registrar <b>' + ids.length + ' referencias</b> por un valor de <b>' +
      eur(valor) + '</b>.</p>' +
    (faltan > 0
      ? '<p>⚠️ Quedan <b>' + faltan + ' sin contar</b>. Las que no cuentes no entran en la ' +
        'valoración: el sistema las leerá como si valieran 0 € y la desviación de la semana ' +
        'saldrá inflada. Usa el filtro «Sin contar» para repasarlas.</p>'
      : '<p>Están contadas todas las referencias del catálogo.</p>') +
    (ESTADO && ESTADO.yaHoy
      ? '<p>Ya existe un recuento de hoy: este lo <b>sustituye</b>.</p>' : '') +
    '<p>Al confirmar, el nivel de cada referencia en el economato pasa a ser el contado.</p>';
  document.getElementById('modal').classList.add('on');
};
document.getElementById('m-no').onclick = () =>
  document.getElementById('modal').classList.remove('on');

document.getElementById('m-si').onclick = async function(){
  this.disabled = true; this.textContent = 'Enviando…';
  try{
    const r = await post({ action:'cs_recuento', cantidades: CANT });
    if(sesionCaida(r)) return;
    if(!r.ok) throw new Error(r.error || 'Error al guardar');

    localStorage.removeItem(BORRADOR);
    document.getElementById('modal').classList.remove('on');
    document.getElementById('cabecera').innerHTML =
      '<div class="aviso bien"><b>Recuento cerrado</b> · ' + r.referencias +
      ' referencias · ' + eur(r.valoracion) + '<br>' +
      (r.sustituido ? 'Ha sustituido al recuento anterior de hoy. ' : '') +
      'Ya está en INVENTARIOS. El cierre del lunes a las 20:00 lo usará para calcular ' +
      'el consumo real de la semana.</div>';
    toast('Recuento registrado: ' + eur(r.valoracion));
    CANT = {};
    ESTADO = await jsonp({ action:'cs_ultimo_recuento' });
    pintar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }catch(e){
    toast('No se pudo guardar: ' + e.message + '. Lo contado sigue guardado en este dispositivo.');
  }finally{
    this.disabled = false; this.textContent = 'Confirmar';
  }
};

/* ── ARRANQUE ── */
document.getElementById('quien').innerHTML =
  ((window.VIVACE_USER||{}).nombre || '') + '<br><a href="/Portal/">← portal</a>';
window.addEventListener('beforeunload', e => {
  if(Object.keys(CANT).length){ e.preventDefault(); e.returnValue = ''; }
});
cargar();
</script>
</body>
</html>
